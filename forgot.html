<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Student Information Board</title>
  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="icon" href="./images/naitlogo.jpg">
  <script src="./scripts/login.js" defer></script>
  <script src="./scripts/script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
  <header class="site-header" id="mainHeader">
        <div class="logo">Dept. of IFT</div>

        <!-- Hamburger for Mobile -->
        <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
        </div>

        <nav class="navbar" id="navbarMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="announcements.html">Announcements</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="timetable.html">Timetable</a></li>
            <li><a href="results.html">Results</a></li>

            <!-- Auth Buttons -->
            <li><a href="login.html" class="login-btn">Login</a></li>
            <li><a href="#" class="logout-btn" style="display: none;">Logout</a></li>

        </ul>
        </nav>
  </header>

  <div class="auth-container">
    <h2>Forgot Password</h2>
    <p class="auth-info">Enter your registered email address and we’ll send you instructions to reset your password.</p>

    <form class="auth-form" id="forgotForm">
      <div class="form-group">
        <label for="forgotEmail">Email Address</label>
        <input type="email" id="forgotEmail" placeholder="Enter your email" required>
      </div>
      <button type="submit" class="btn">Reset Password</button>
      <p class="auth-link"><a href="login.html">Back to Login</a></p>
    </form>
  </div>

  <script src="./scripts/global.js" defer></script>
</body>
</html>

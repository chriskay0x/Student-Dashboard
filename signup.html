<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | Student Information Board</title>
  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="icon" href="./images/naitlogo.jpg">
  <script src="./scripts/script.js" defer></script>
  <script src="./scripts/signup.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
  <header class="site-header" id="mainHeader">
        <div class="logo">Dept. of IFT</div>

        <!-- Hamburger for Mobile -->
        <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
        </div>

        <nav class="navbar" id="navbarMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="announcements.html">Announcements</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="timetable.html">Timetable</a></li>
            <li><a href="results.html">Results</a></li>

            <!-- Auth Buttons -->
            <li><a href="login.html" class="login-btn">Login</a></li>
            <li><a href="#" class="logout-btn" style="display: none;">Logout</a></li>

        </ul>
        </nav>
  </header>

  <div class="auth-container signy">
    <h2>Create Account</h2>
    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="signupName" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label for="email">Email/Username</label>
        <input type="email" id="signupEmail" placeholder="Email Address" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="signupPassword" placeholder="Enter your password" required>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter your password" required>
      </div>
      
      <button type="submit" class="btn">Sign Up</button>
      <p class="auth-link">Already have an account? <a href="./login.html">Login</a></p>
    </form>
    <p id="signupMessage"></p>
  </div>

  <script src="./scripts/global.js" defer></script>
</body>
</html>

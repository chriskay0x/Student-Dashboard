<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Information Board</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="icon" href="./images/naitlogo.jpg">
    <script src="./scripts/script.js" defer></script>
    <script src="./scripts/login.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
  <header class="site-header" id="mainHeader">
        <div class="logo">Dept. of IFT</div>

        <!-- Hamburger for Mobile -->
        <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
        </div>

        <nav class="navbar" id="navbarMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="announcements.html">Announcements</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="timetable.html">Timetable</a></li>
            <li><a href="results.html">Results</a></li>

            <!-- Auth Buttons -->
            <li><a href="login.html" class="login-btn">Login</a></li>
            <li><a href="#" class="logout-btn" style="display: none;">Logout</a></li>

        </ul>
        </nav>
  </header>

  <div class="auth-container">
    <h2>Student Login</h2>

    <form class="auth-form" id="loginForm">
        <div class="form-group">
            <label for="email">Email/Username</label>
            <input type="text" id="loginEmail" placeholder="Enter your email or username" required>
        </div>
        <!-- =============== -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <!-- =============== -->
        <div class="new-group">
            <a href="forgot.html" class="forgot-link">Forgot Password?</a>
        </div>
      
      <button type="submit" class="btn">Login</button>
      <p class="auth-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
    <p id="loginMessage"></p>
  </div>

  <script src="./scripts/global.js" defer></script>
</body>
</html>
